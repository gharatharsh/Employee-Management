<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f0f4f8;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    form {
        background: #fff;
        padding: 20px 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        width: 300px;
    }

    fieldset {
        border: none;
        padding: 0;
    }

    legend {
        font-size: 1.3em;
        font-weight: bold;
        color: #333;
        margin-bottom: 15px;
        text-align: center;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #444;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom: 15px;
    }

    input[type="text"]:focus {
        border-color: #007BFF;
        outline: none;
        box-shadow: 0 0 4px rgba(0,123,255,0.5);
    }

    input[type="submit"] {
        width: 100%;
        padding: 10px;
        background: #007BFF;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    input[type="submit"]:hover {
        background: #0056b3;
    }
</style>
</head>
<body>

<form action="verifyEmail" method="get">
    <fieldset>
        <legend>Forgot Password</legend>

        <label for="email">Enter Email:</label>
        <input type="text" name="email" id="email">

        <input type="submit" value="Verify Email">
    </fieldset>
</form>

</body>
</html>
